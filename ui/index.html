<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>片库 · 科普短视频</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ------------------------------------------------------------------
   设计纪律（同 docs/design/design-taste.md）
   1. 不居中：masthead 左对齐，标题极大 / 元信息极小的反差
   2. 封面是主角：卡片**没有**边框、圆角、阴影，只有图 + 字
   3. 一个强调色（青），其余全靠中性色和字重
   4. 直角（2px），阴影只在浮层出现一次
   5. 效果不叠加：不用毛玻璃 + 渐变 + 阴影三件套
   ---------------------------------------------------------------- */
:root{
  --bg:#0A0D12; --panel:#0D1219; --raise:#111823; --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.16);
  --text:#F2F5F8; --dim:#8794A5; --faint:#5A6675;
  --accent:#3DE8FF;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}

/* ---------- masthead ---------- */
header{padding:40px 44px 0}
.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}
.overline{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);
  margin-bottom:14px}
h1{margin:0;font-size:clamp(38px,4.6vw,60px);line-height:.96;letter-spacing:-.03em;font-weight:800}
h1 .thin{color:var(--faint);font-weight:300;letter-spacing:0}
.mast .right{text-align:right;color:var(--dim);font-size:12px;line-height:1.9;
  font-variant-numeric:tabular-nums}
.mast .right b{color:var(--text);font-weight:600}
.rule{height:1px;background:var(--line2);margin-top:26px}

/* ---------- toolbar：文字式控件，不用胶囊 ---------- */
.tools{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:15px 44px;
  border-bottom:1px solid var(--line)}
.search{flex:1;min-width:190px}
.search input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--text);font:inherit;padding:7px 0;outline:none}
.search input:focus{border-bottom-color:var(--accent)}
.search input::placeholder{color:var(--faint)}
.seg{display:flex;gap:2px}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;
  padding:7px 12px;cursor:pointer;border-bottom:1px solid transparent}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--text);border-bottom-color:var(--accent)}
.themes{display:flex;gap:14px;flex-wrap:wrap}
.themes button{background:none;border:0;color:var(--faint);font:inherit;font-size:12px;
  cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}
.themes button i{width:8px;height:8px;display:block}
.themes button:hover{color:var(--dim)}
.themes button.on{color:var(--text)}
.act{background:none;border:0;border-bottom:1px solid var(--accent);color:var(--accent);
  font:inherit;font-size:13px;font-weight:600;padding:6px 0;cursor:pointer}
.act:hover{color:#fff;border-bottom-color:#fff}

/* ---------- 片库网格：封面说话，卡片零装饰 ---------- */
main{padding:30px 44px 80px}
.grid{display:grid;gap:34px 26px;grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.card{cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit;
  display:flex;flex-direction:column;font:inherit}
.card .thumb{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--raise)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.96);transition:filter .2s,transform .3s}
.card:hover .thumb img{filter:saturate(1.05) brightness(1.05);transform:scale(1.012)}
.card .num{display:flex;align-items:center;gap:8px;color:var(--dim);
  font:10.5px/1 var(--mono);letter-spacing:.1em;margin-bottom:8px;
  font-variant-numeric:tabular-nums}
.card .num i{width:6px;height:6px;display:block}
.card .num b{color:var(--text);font-weight:600}
.card h3{margin:11px 0 0;font-size:13.5px;font-weight:600;line-height:1.45;
  /* 标题固定占两行高度：一行的和两行的卡片底边才能对齐（今天是基线节奏） */
  min-height:2.9em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover h3{text-decoration:underline;text-decoration-color:var(--faint);
  text-underline-offset:3px}
.card .meta{margin-top:6px;font-size:11px;color:var(--faint);letter-spacing:.04em;
  display:flex;align-items:center;gap:7px;
  /* 单行 + 省略：换行会让同一行的卡片底边参差 */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta i{width:14px;height:2px;display:block;flex:0 0 auto}
.empty{color:var(--faint);padding:80px 0;font-size:13px}

/* ---------- 抽屉 ---------- */
.veil{position:fixed;inset:0;background:rgba(4,6,10,.74);opacity:0;pointer-events:none;
  transition:.18s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,95vw);background:var(--panel);
  border-left:1px solid var(--line2);transform:translateX(100%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:50;overflow-y:auto;
  padding:34px 40px 80px}
.drawer.on{transform:none}
.dh{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.dh h2{margin:0;font-size:30px;line-height:1.16;letter-spacing:-.02em;font-weight:700}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--faint);font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.x{background:none;border:1px solid var(--line2);color:var(--dim);font:inherit;font-size:12px;
  padding:7px 14px;cursor:pointer;border-radius:2px}
.x:hover{color:var(--text);border-color:var(--text)}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;margin-top:28px;
  padding-top:26px;border-top:1px solid var(--line)}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
video,img.plain{width:100%;display:block;background:#000;border:0;border-radius:2px}
img.plain{background:var(--raise)}
.sec{margin-top:30px}
.sec h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  margin:0 0 12px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.thumbs img{width:100%;display:block;cursor:zoom-in;border-radius:2px}
.shot{display:grid;grid-template-columns:66px 1fr;gap:14px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:13px;line-height:1.7}
.shot b{color:var(--accent);font:600 11px/1.9 var(--mono);letter-spacing:.06em;
  text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
select,.btn{font:inherit;font-size:12.5px;border-radius:2px;padding:8px 13px;cursor:pointer}
select{background:var(--raise);border:1px solid var(--line2);color:var(--text);outline:none}
.btn{background:none;border:1px solid var(--line2);color:var(--dim)}
.btn:hover{color:var(--text);border-color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04131a;font-weight:700}
.btn.primary:hover{background:#fff;border-color:#fff;color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;
  font:11.5px/1.65 var(--mono);color:#93A2B4;white-space:pre-wrap;max-height:230px;
  overflow:auto;display:none}
.log.on{display:block}
.toast{position:fixed;left:44px;bottom:30px;background:var(--text);color:#0A0D12;
  padding:11px 18px;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px);
  transition:.18s;z-index:80;pointer-events:none;border-radius:2px}
.toast.on{opacity:1;transform:none}

/* ---------- 新建浮层 ---------- */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;
  pointer-events:none;width:min(600px,93vw);max-height:88vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line2);padding:30px 32px;z-index:60;transition:.18s;
  box-shadow:0 40px 120px rgba(0,0,0,.7);border-radius:2px}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal h3{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.modal p.hint{margin:0 0 22px;color:var(--faint);font-size:12.5px;line-height:1.65}
.modal label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:16px}
.modal input,.modal textarea,.modal select{width:100%;margin-top:7px;background:var(--bg);
  border:1px solid var(--line2);color:var(--text);border-radius:2px;padding:10px 12px;
  font:inherit;font-size:13.5px;outline:none}
.modal textarea{resize:vertical;line-height:1.75}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check{display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;
  font-size:13px;color:var(--dim);margin-bottom:20px}
.check input{width:auto;margin:0}

.viewtoggle { display: flex; gap: 18px; margin-left: 28px; align-self: flex-end; }
.viewtoggle button { background: none; border: 0; padding: 0 0 4px; color: var(--ink2);
  font: 600 13px/1 var(--sans); letter-spacing: .04em; cursor: pointer; border-bottom: 2px solid transparent; }
.viewtoggle button.on { color: var(--ink0); border-bottom-color: var(--ink0); }

.wb { padding: 8px 0 80px; }
.wbhead { display: grid; grid-template-columns: 1fr 420px; gap: 32px; align-items: start;
  padding: 22px 0 20px; border-bottom: 1px solid var(--line); }
.wbsub { color: var(--ink2); font-size: 13px; line-height: 1.7; margin: 8px 0 0; }
.wblog { font: 12px/1.7 var(--mono); color: var(--ink2); background: var(--bg1);
  border: 1px solid var(--line); padding: 12px 14px; max-height: 120px; overflow: auto;
  white-space: pre-wrap; }
.wbtable { margin-top: 4px; }
.wbrow { display: grid; grid-template-columns: 1fr repeat(5, 132px); gap: 0;
  align-items: center; border-bottom: 1px solid var(--line); padding: 14px 0; }
.wbrow.head { padding: 12px 0 10px; }
.wbrow.head div { font: 600 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink3); }
.wbtitle { font-weight: 650; font-size: 15px; cursor: pointer; }
.wbtitle:hover { text-decoration: underline; text-underline-offset: 3px; }
.wbslug { font: 11px/1 var(--mono); color: var(--ink3); margin-top: 5px; letter-spacing: .04em; }
.stg { display: flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer;
  padding: 6px 0; color: var(--ink2); font: 12px/1 var(--sans); }
.stg .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line2);
  box-shadow: inset 0 0 0 1px var(--line); }
.stg.done .dot { background: #2f6d4f; box-shadow: none; }
.stg.run .dot { background: #b4751d; animation: pulse 1s infinite; }
.stg.fail .dot { background: #a33; box-shadow: none; }
.stg:hover { color: var(--ink0); }
@keyframes pulse { 50% { opacity: .35; } }
</style>

<header>
  <div class="mast">
    <div>
      <div class="overline">科普短视频 / 片库</div>
      <h1>片库<span class="thin">　一次讲清一件事</span></h1>
    </div>
    <div class="right" id="sub">加载中…</div>
    <div class="viewtoggle" id="viewtoggle">
      <button data-v="library" class="on">片库</button>
      <button data-v="workbench">工作台</button>
    </div>
  </div>
  <div class="rule"></div>
</header>

<div class="tools">
  <div class="search"><input id="q" placeholder="搜标题 / 钩子 / 学科 / slug"></div>
  <div class="seg" id="seg">
    <button class="on" data-f="all">全部</button>
    <button data-f="long">长版</button>
    <button data-f="short">短版</button>
  </div>
  <div class="themes" id="themefilter"></div>
  <button class="act" id="btnNew">＋ 新建一条</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的片子。换个关键词，或者点「＋ 新建一条」。</div>
  <section class="wb" id="wb" style="display:none">
    <div class="wbhead">
      <div>
        <div class="overline">制作工作台</div>
        <p class="wbsub">每道工序可以单独重跑；状态由产物推导，服务重启也还在。</p>
      </div>
      <div class="wblog" id="wblog">选一道工序开始。</div>
    </div>
    <div class="wbtable" id="wbtable"></div>
  </section>
</main>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal" id="modal">
  <h3>新建一条</h3>
  <p class="hint">给标题和五句口播。画面类型、每镜时长、封面版式、一张图都会自动生成，之后可以再改。</p>
  <label>标题<input id="nTitle" placeholder="例：为什么手机屏幕在太阳下看不清"></label>
  <label>栏目名<input id="nKicker" placeholder="生活物理"></label>
  <label>口播（一行一句，五句；勾短版则四句）
    <textarea id="nLines" rows="6" placeholder="正午阳光下，手机屏幕亮度只有 1000 尼特……&#10;屏幕不是不够亮，是被反光盖住了。&#10;……"></textarea>
  </label>
  <div class="row2">
    <label>主题<select id="nTheme"></select></label>
    <label>配音<select id="nVoice">
      <option value="yunxi">云希 · 阳光邻家</option>
      <option value="yunjian">云健 · 浑厚沉稳</option>
      <option value="xiaoxiao">晓晓 · 活泼亲切</option>
    </select></label>
  </div>
  <label class="check"><input type="checkbox" id="nShort"> 短版（四句，13~18 秒）</label>
  <div class="actions">
    <button class="btn primary" id="nGo">生成并渲染</button>
    <button class="btn" id="nCancel">取消</button>
  </div>
  <div class="log" id="nLog"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const THEME_COLOR = {
  midnight:"#3DE8FF", jade:"#3FD6A4", aubergine:"#C08CF0", "noir-gold":"#D9B45B",
  graphite:"#BCBCC6", porcelain:"#1D4ED8", "rice-paper":"#A6392F", arctic:"#0C6FA8"
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LIB = {items:[], themes:[]};
/* URL 里的筛选必须在**第一次 render 之前**读出来：
   render() 末尾会调 syncURL() 把当前筛选写回 URL，而启动时那次 render 的
   筛选是空值——它会先把 ?kind=short&theme=arctic 抹成 "/"，之后再读就晚了。
   （这个 bug 是筛选截图拍出来还是全 33 条才发现的。） */
const INIT = new URLSearchParams(location.search);
const FILTER = {kind: INIT.get("kind") || "all", theme: INIT.get("theme") || null,
                q: INIT.get("q") || ""};

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"), 2400); }

/* ---------------- 数据 ---------------- */
async function boot(){
  LIB = await (await fetch("/api/library")).json();
  $("#sub").innerHTML = `<b>${LIB.items.length}</b> 条<br>${esc(LIB.root)}`;
  $("#q").value = FILTER.q;
  $("#seg").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.f === FILTER.kind));
  const tf = $("#themefilter");
  tf.innerHTML = "";
  for (const t of LIB.themes){
    const b = document.createElement("button");
    b.innerHTML = `<i style="background:${THEME_COLOR[t.key]||"#666"}"></i>${esc(t.name||t.key)}`;
    b.title = t.note || "";
    if (FILTER.theme === t.key) b.classList.add("on");
    b.onclick = () => {
      FILTER.theme = FILTER.theme === t.key ? null : t.key;
      [...tf.children].forEach(c => c.classList.toggle("on", c === b && FILTER.theme));
      render();
    };
    tf.appendChild(b);
  }
  render();
}

function syncURL(){
  // 筛选条件写进 query：可分享，也让"筛了什么"这件事可验证（截图能复现同一屏）
  const u = new URLSearchParams();
  if (FILTER.kind !== "all") u.set("kind", FILTER.kind);
  if (FILTER.theme) u.set("theme", FILTER.theme);
  if (FILTER.q.trim()) u.set("q", FILTER.q.trim());
  const qs = u.toString();
  history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
}

function render(){
  const g = $("#grid"), q = FILTER.q.trim().toLowerCase();
  const list = LIB.items.filter(it => {
    if (FILTER.kind !== "all" && it.format !== FILTER.kind) return false;
    if (FILTER.theme && it.theme !== FILTER.theme) return false;
    if (!q) return true;
    return (it.title+" "+it.hooks+" "+it.subject+" "+it.slug).toLowerCase().includes(q);
  });
  $("#empty").style.display = list.length ? "none" : "block";
  g.innerHTML = list.map(it => {
    const cover = it.files["cover_short.png"] || it.files["cover_f1.png"] || "";
    // 序号用片库顺序而不是 slug 里的数字：短版 slug 是 short-03-blindspot-18s，
    // 没有开头数字，按 /^(\d+)/ 取会得到空串（实测筛短版时序号全空）。
    const num = String(LIB.items.indexOf(it) + 1).padStart(2, "0");
    return `<button class="card" data-slug="${esc(it.slug)}">
      <div class="num"><i style="background:${THEME_COLOR[it.theme]||"#666"}"></i>
        ${num ? `<b>${num}</b>` : ""}·${it.seconds}s</div>
      <div class="thumb">
        ${cover ? `<img loading="lazy" src="${cover}" alt="">` : ""}
      </div>
      <h3>${esc(it.title)}</h3>
      <div class="meta">${esc(it.subject)} · ${esc(it.voice)}</div>
    </button>`;
  }).join("");
  g.querySelectorAll(".card").forEach(c => c.onclick = () => open(c.dataset.slug));
  syncURL();
}

/* ---------------- 详情 ---------------- */
async function open(slug){
  const d = await (await fetch("/api/item?slug="+encodeURIComponent(slug))).json();
  if (d.error) return toast("读不到这条");
  const mp4 = d.files[d.slug+".mp4"], sum = d.files["summary.png"];
  const covers = Object.entries(d.files).filter(([k]) => k.startsWith("cover_"));
  const opts = LIB.themes.map(t =>
    `<option value="${t.key}" ${t.key===d.theme?"selected":""}>${esc(t.name)}${t.light?" · 浅":""}</option>`).join("");
  $("#drawer").innerHTML = `
    <div class="dh">
      <div>
        <h2>${esc(d.title)}</h2>
        <div class="kv">
          <span>${esc(d.slug)}</span><span>${d.format==="short"?"短版":"长版"} ${d.seconds}s</span>
          <span>${esc(d.subject)}</span><span>配音 ${esc(d.voice)}</span>
          <span>主题 ${esc(d.theme)}</span><span>封面 ${esc(d.cover_direction||"v1")}</span>
        </div>
      </div>
      <button class="x" id="btnClose">关闭</button>
    </div>
    <div class="cols">
      <div>
        ${mp4 ? `<video controls preload="metadata" src="${mp4}"></video>`
              : `<div class="empty">还没渲成片</div>`}
        <div class="actions">
          <select id="themesel">${opts}</select>
          <button class="btn primary" id="btnTheme">换主题重渲封面</button>
          <button class="btn" id="btnRender">重渲成片</button>
          <button class="btn" id="btnVerify">跑门禁</button>
        </div>
        <div class="log" id="log"></div>
      </div>
      <div>
        ${sum ? `<div class="sec"><h3>一张图</h3><img class="plain" src="${sum}"></div>` : ""}
        <div class="sec"><h3>封面版式</h3>
          <div class="thumbs">${covers.map(([k,v]) =>
            `<a href="${v}" target="_blank"><img src="${v}" title="${k}" alt=""></a>`).join("")}</div>
        </div>
      </div>
    </div>
    <div class="sec"><h3>脚本</h3>
      ${(d.shots||[]).map(s => `<div class="shot"><b>${esc(s.id)}</b><div>${esc(s.narration)}
        ${s.note?`<div style="color:var(--faint);font-size:12px">注：${esc(s.note)}</div>`:""}</div></div>`).join("")}
    </div>
    ${d.kernel ? `<div class="sec"><h3>算式</h3><div style="color:var(--dim)">${esc(d.kernel)}</div></div>` : ""}`;
  $("#veil").classList.add("on"); $("#drawer").classList.add("on");
  history.replaceState(null, "", "#" + encodeURIComponent(d.slug));

  $("#btnClose").onclick = closeDrawer;
  const log = $("#log");
  const runJob = async (url, body) => {
    log.classList.add("on"); log.textContent = "启动…";
    const j = await (await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)})).json();
    if (j.error) return toast(j.error);
    poll(j.job, log, async () => { await boot(); open(d.slug); });
  };
  $("#btnTheme").onclick = () => runJob("/api/theme", {slug:d.slug, theme:$("#themesel").value});
  $("#btnRender").onclick = () => runJob("/api/render", {slug:d.slug});
  $("#btnVerify").onclick = () => runJob("/api/verify", {slug:d.slug});
}

function closeDrawer(){
  $("#veil").classList.remove("on"); $("#drawer").classList.remove("on");
  history.replaceState(null, "", location.pathname);
}

/* ---------------- 任务轮询 ---------------- */
async function poll(id, log, done){
  for(;;){
    const j = await (await fetch("/api/job?id="+id)).json();
    log.textContent = `[${j.status}] ${j.elapsed ? j.elapsed+"s" : ""}\n` + (j.log||[]).join("\n");
    log.scrollTop = log.scrollHeight;
    if (j.status === "done"){ toast("完成"); done && await done(); return; }
    if (j.status === "fail"){ toast("失败，看日志"); return; }
    await new Promise(r => setTimeout(r, 800));
  }
}

/* ---------------- 新建 ---------------- */

// ---------------------------------------------------------------- 制作工作台
let WB = { stages: [], projects: [] };
let VIEW = "library";
const STAGE_LABEL = { script: "创意脚本", render: "配音成片", assets: "封面物料",
                      qa: "质检", deliver: "发布包" };

function setView(v) {
  VIEW = v;
  $("#viewtoggle").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.v === v));
  $("#grid").style.display = v === "library" ? "" : "none";
  $("#empty").style.display = "none";
  $("#wb").style.display = v === "workbench" ? "" : "none";
  document.querySelector(".tools").style.display = v === "library" ? "" : "none";
  if (v === "workbench") loadWorkbench();
}

async function loadWorkbench() {
  WB = await (await fetch("/api/projects")).json();
  const head = `<div class="wbrow head"><div>项目</div>${
    WB.stages.map(s => `<div title="${esc(s.desc)}">${esc(s.name)}</div>`).join("")}</div>`;
  const rows = WB.projects.map(p => {
    const cells = WB.stages.map(s => {
      const st = p.stages[s.id] ? "done" : "";
      return `<button class="stg ${st}" data-slug="${esc(p.slug)}" data-stage="${s.id}"
        title="${esc(s.desc)}"><i class="dot"></i>${p.stages[s.id] ? "已完成" : "待运行"}</button>`;
    }).join("");
    return `<div class="wbrow"><div><div class="wbtitle" data-open="${esc(p.slug)}">${esc(p.title)}</div>
      <div class="wbslug">${esc(p.slug)}</div></div>${cells}</div>`;
  }).join("");
  $("#wbtable").innerHTML = head + rows;
}

async function runStage(slug, stage, btn) {
  btn.classList.add("run");
  btn.innerHTML = `<i class="dot"></i>运行中`;
  $("#wblog").textContent = `[${slug}] ${STAGE_LABEL[stage] || stage} 开始…`;
  const r = await (await fetch("/api/stage", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ slug, stage })
  })).json();
  if (!r.job) { $("#wblog").textContent = "启动失败：" + JSON.stringify(r); return; }
  for (;;) {
    await new Promise(res => setTimeout(res, 1200));
    const j = await (await fetch("/api/job?id=" + r.job)).json();
    if (j.log && j.log.length) $("#wblog").textContent =
      `[${slug}] ${STAGE_LABEL[stage]}\n` + j.log.join("\n");
    if (j.status === "done" || j.status === "fail") {
      $("#wblog").textContent += `\n—— ${j.status === "done" ? "通过" : "失败"}（${j.elapsed || 0}s）`;
      await loadWorkbench();
      break;
    }
  }
}

function openModal(){
  const sel = $("#nTheme");
  if (!sel.children.length){
    sel.innerHTML = LIB.themes.map(t =>
      `<option value="${t.key}">${esc(t.name)}${t.light?" · 浅":""}</option>`).join("");
  }
  $("#nLog").classList.remove("on");
  $("#modal").classList.add("on"); $("#veil").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); $("#veil").classList.remove("on"); }

$("#btnNew").onclick = openModal;
$("#nCancel").onclick = closeModal;
$("#nGo").onclick = async () => {
  const title = $("#nTitle").value.trim();
  const lines = $("#nLines").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!title || !lines.length) return toast("标题和口播都要填");
  const log = $("#nLog"); log.classList.add("on"); log.textContent = "生成中…";
  const r = await (await fetch("/api/project", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title, lines, kicker: $("#nKicker").value.trim() || null,
      theme: $("#nTheme").value, voice: $("#nVoice").value, short: $("#nShort").checked})})).json();
  if (r.error) return toast(r.error);
  toast("已建项目：" + r.slug + "（脚本工序在跑）");
  poll(r.job, log, async () => {
    await boot(); closeModal(); setView("workbench"); open(r.slug);
  });
};

/* ---------------- 全局 ---------------- */
$("#q").oninput = e => { FILTER.q = e.target.value; render(); };
$("#seg").querySelectorAll("button").forEach(el => el.onclick = () => {
  $("#seg").querySelectorAll("button").forEach(c => c.classList.remove("on"));
  el.classList.add("on"); FILTER.kind = el.dataset.f; render();
});
$("#veil").onclick = () => {
  if ($("#modal").classList.contains("on")) closeModal(); else closeDrawer();
};
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeModal(); closeDrawer(); } });

$("#viewtoggle").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (b) setView(b.dataset.v);
});
$("#wbtable").addEventListener("click", e => {
  const stg = e.target.closest(".stg");
  if (stg && stg.dataset.slug) return runStage(stg.dataset.slug, stg.dataset.stage, stg);
  const t = e.target.closest("[data-open]");
  if (t) open(t.dataset.open);
});

boot().then(() => {
  const h = decodeURIComponent((location.hash||"").replace("#",""));
  if (h) open(h);
  if (INIT.get("view") === "workbench") setView("workbench");
});
